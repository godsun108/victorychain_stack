global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'fastapi-agent'
    static_configs:
      - targets: ['fastapi-agent:8080']
  - job_name: 'momentum-local'
    static_configs:
      - targets: ['host.docker.internal:9108']
  - job_name: 'treasury-exporter'
    static_configs:
      - targets: ['host.docker.internal:9112']
  - job_name: 'self-prometheus'
    static_configs:
      - targets: ['prometheus:9090']
