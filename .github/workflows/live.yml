name: live-smoke-binanceus

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, master ]
    paths:
      - '**/*.py'
      - 'Makefile'
      - '.github/workflows/live.yml'

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt || true
      - name: Preflight
        run: make preflight
        env:
          MODE: live
          EXCHANGE: binanceus
          # Provide both variable names for compatibility
          BINANCEUS_API_KEY: ${{ secrets.BINANCEUS_KEY }}
          BINANCEUS_API_SECRET: ${{ secrets.BINANCEUS_SECRET }}
          BINANCEUS_KEY: ${{ secrets.BINANCEUS_KEY }}
          BINANCEUS_SECRET: ${{ secrets.BINANCEUS_SECRET }}
          APPROVAL_SECRET: ${{ secrets.APPROVAL_SECRET_CI }}
          SYMBOLS: BTC/USDT,ETH/USDT
          MAX_NOTIONAL_PER_ORDER: 10
          MAX_OPEN_ORDERS: 1
          ENABLE_RATE_LIMIT: "true"
          TIMEOUT_MS: 20000

  proof:
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt || true
      - name: Run proof (live mode, dry)
        run: make proof
        env:
          MODE: live
          EXCHANGE: binanceus
          APPROVAL_SECRET: ${{ secrets.APPROVAL_SECRET_CI }}
      - uses: actions/upload-artifact@v4
        with:
          name: live-proof
          path: runtime/proofs/live_proof.json
          if-no-files-found: ignore

  live_smoke:
    runs-on: ubuntu-latest
    needs: proof
    if: contains(github.event.pull_request.labels.*.name, 'approved-live')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt || true
      - name: Run live smoke (create→cancel)
        run: make live-smoke
        env:
          MODE: live
          EXCHANGE: binanceus
          # Provide both variable names for compatibility
          BINANCEUS_API_KEY: ${{ secrets.BINANCEUS_KEY }}
          BINANCEUS_API_SECRET: ${{ secrets.BINANCEUS_SECRET }}
          BINANCEUS_KEY: ${{ secrets.BINANCEUS_KEY }}
          BINANCEUS_SECRET: ${{ secrets.BINANCEUS_SECRET }}
          APPROVAL_SECRET: ${{ secrets.APPROVAL_SECRET_CI }}
          SYMBOLS: BTC/USDT
          MAX_NOTIONAL_PER_ORDER: 5
          MAX_OPEN_ORDERS: 1
          ENABLE_RATE_LIMIT: "true"
          TIMEOUT_MS: 20000
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-live-logs
          path: smoke_live.log
          if-no-files-found: ignore
