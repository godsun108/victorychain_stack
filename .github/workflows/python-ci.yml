name: Python CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  iso20022-institutional-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check admin env token hygiene
        run: |
          python scripts/check_admin_env_hygiene.py \
            --env-file .env.example \
            --env-file .env.inhouse.example \
            --expect-bootstrap-disabled \
            --expect-legacy-disabled \
            --require-empty-bootstrap-tokens \
            --require-empty-legacy-tokens

      - name: Run ISO20022 and regression tests
        run: |
          pytest -q \
            tests/test_iso20022_validation.py \
            tests/test_onchain_iso_messaging.py \
            tests/test_iso20022_payments_route.py \
            tests/test_iso20022_schema_pack_builder.py \
            tests/test_iso20022_compliance_gate.py \
            tests/test_impact_mvp.py \
            tests/test_self_service.py \
            tests/test_delivery_compat.py

      - name: Build external schema pack
        run: |
          python scripts/build_iso20022_external_schema_pack.py --out-dir compliance/iso20022/external_schema_pack_ci --force

      - name: Verify external schema pack
        run: |
          python compliance/iso20022/external_schema_pack_ci/verify_schema_pack.py

      - name: Run strict ISO20022 institutional gate
        run: |
          python scripts/iso20022_compliance_gate.py \
            --schema-root compliance/iso20022/external_schema_pack_ci/schemas \
            --profile-path compliance/iso20022/external_schema_pack_ci/profile/vusd_institutional_profile.json \
            --require-external-schema-pack \
            --out runtime/reports/compliance/iso20022/iso20022_vusd_compliance_gate_ci.json
