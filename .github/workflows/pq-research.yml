name: Victory PQ Research

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "victorychain_stack/src/victory_impact/pq_*.py"
      - "victorychain_stack/src/victory_impact/providers/**"
      - "victorychain_stack/tests/test_pq_*.py"
      - "victorychain_stack/tests/test_liboqs_provider_boundary.py"
      - "victorychain_stack/scripts/pq_smoke.py"
      - "victorychain_stack/requirements-pq.txt"
      - ".github/workflows/pq-research.yml"
  pull_request:
    branches: [main]
    paths:
      - "victorychain_stack/src/victory_impact/pq_*.py"
      - "victorychain_stack/src/victory_impact/providers/**"
      - "victorychain_stack/tests/test_pq_*.py"
      - "victorychain_stack/tests/test_liboqs_provider_boundary.py"
      - "victorychain_stack/scripts/pq_smoke.py"
      - "victorychain_stack/requirements-pq.txt"
      - ".github/workflows/pq-research.yml"

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: victorychain_stack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core test dependencies
        run: pip install -r requirements.txt
      - name: Run PQ boundary tests
        run: pytest -q tests/test_pq_provider.py tests/test_liboqs_provider_boundary.py tests/test_pq_evidence.py tests/test_pq_smoke_evidence.py

  # Real-provider smoke remains intentionally separate from the production
  # gate until the provider/version is pinned and reviewed.
