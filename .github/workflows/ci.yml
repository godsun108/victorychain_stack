name: Victory Impact CI

on:
  push:
    branches: [main]
    paths:
      - "victorychain_stack/**"
      - ".github/workflows/ci.yml"
      - "QUANTUM_SECURITY.md"
      - "VICTORY_*.md"
      - "SECURITY_AUDIT_*.md"
  pull_request:
    branches: [main]
    paths:
      - "victorychain_stack/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  impact-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: victorychain_stack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: victorychain_stack/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test
        run: pytest -q

  security-boundary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: victorychain_stack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanner
        run: pip install bandit
      - name: Scan application boundary
        run: bandit -r src/victory_impact -ll
