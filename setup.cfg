[metadata]
name = victorychain_stack
version = 0.2.0
description = VictoryChain nonprofit donation and impact-token MVP
author = VictoryChain
author_email = dev@victorychain.org
license = MIT

[options]
packages = find:
install_requires =
    fastapi
    uvicorn
    sqlalchemy
    pydantic
    pydantic-settings
    psycopg2-binary
    requests
    stripe

[options.packages.find]
where = src

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
